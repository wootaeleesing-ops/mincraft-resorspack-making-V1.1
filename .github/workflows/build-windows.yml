name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MinecraftResourcePackMaker app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftResourcePackMaker-Windows
          path: dist/MinecraftResourcePackMaker.exe
          if-no-files-found: error
          retention-days: 30
